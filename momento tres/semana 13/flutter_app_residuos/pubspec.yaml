name: flutter_app_residuos
description: Clasificador de Residuos Urbanos y Peligrosos con TFLite - Proyecto Bienal UCC
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.12.1
  image_picker: ^1.1.2
  image: ^4.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/modelo_clasificador_19_clases.tflite
    - assets/modelo_mobilenetv2_dynamic_range.tflite
    - assets/labels.txt
